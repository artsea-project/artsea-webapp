name: Commit messages

on:
    pull_request:
        types:
            - opened
            - edited
            - synchronize
            - reopened

permissions:
    contents: read

concurrency:
    group: commit-messages-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate-commit-messages:
        name: Validate commit messages
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out repository history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate Conventional Commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
                  failed=0

                  while IFS= read -r commit; do
                      subject=$(git show --no-patch --format=%s "$commit")

                      if [[ $subject =~ $pattern ]]; then
                          echo "Valid: $commit $subject"
                      else
                          echo "::error title=Invalid commit message::$commit $subject"
                          failed=1
                      fi
                  done < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")

                  exit "$failed"
