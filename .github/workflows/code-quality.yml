name: Code quality

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

concurrency:
    group: code-quality-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    code-quality:
        name: ${{ matrix.check.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                check:
                    - name: Formatting
                      command: format:check
                    - name: Linting
                      command: lint
        steps:
            - name: Check out repository history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check ${{ matrix.check.name }} in every commit
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  while IFS= read -r commit; do
                      echo "::group::${{ matrix.check.name }} $commit"
                      if ! git checkout --detach "$commit" || ! npm run "${{ matrix.check.command }}"; then
                          echo "::endgroup::"
                          exit 1
                      fi
                      echo "::endgroup::"
                  done < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
