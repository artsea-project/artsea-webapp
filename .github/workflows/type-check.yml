name: Type check

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

concurrency:
    group: type-check-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    type-check:
        name: Type check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check TypeScript
              run: npx tsc --noEmit
